services:
  leadengine-mysql:
    image: mysql:8.0
    container_name: leadengine-mysql
    environment:
      MYSQL_DATABASE: leadengine
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - leadengine-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leadengine

  leadengine-api:
    build:
      context: .
      dockerfile: src/LeadEngine.Api/Dockerfile
    container_name: leadengine-api
    depends_on:
      leadengine-mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=leadengine-mysql;Port=3306;Database=leadengine;User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
      IntegracaoLeads__BaseUrl: ${INTEGRACAO_LEADS_BASE_URL:-}
      IntegracaoLeads__Endpoint: ${INTEGRACAO_LEADS_ENDPOINT:-/api/leads}
      IntegracaoLeads__ApiKey: ${INTEGRACAO_LEADS_API_KEY:-}
      CampaignGeneration__Provider: ${CAMPAIGN_GENERATION_PROVIDER:-Fake}
      CampaignGeneration__FallbackToFake: ${CAMPAIGN_GENERATION_FALLBACK_TO_FAKE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      WHATSAPP_NUMERO: ${WHATSAPP_NUMERO:-}
      WHATSAPP_MENSAGEM_PADRAO: ${WHATSAPP_MENSAGEM_PADRAO:-}
      APPLICATION_PUBLIC_BASE_URL: ${APPLICATION_PUBLIC_BASE_URL:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_REDIRECT_URI: ${GOOGLE_ADS_REDIRECT_URI:-http://localhost:5173/leadcaptura/configuracoes?googleAdsCallback=1}
      GOOGLE_ADS_DEFAULT_DAILY_BUDGET: ${GOOGLE_ADS_DEFAULT_DAILY_BUDGET:-10.00}
      GOOGLE_ADS_DEFAULT_COUNTRY_CODE: ${GOOGLE_ADS_DEFAULT_COUNTRY_CODE:-BR}
      GOOGLE_ADS_DEFAULT_LANGUAGE_CODE: ${GOOGLE_ADS_DEFAULT_LANGUAGE_CODE:-pt}
      GOOGLE_ADS_DEFAULT_CURRENCY_CODE: ${GOOGLE_ADS_DEFAULT_CURRENCY_CODE:-BRL}
      GOOGLE_ADS_DEFAULT_KEYWORD_MATCH_TYPE: ${GOOGLE_ADS_DEFAULT_KEYWORD_MATCH_TYPE:-Phrase}
      GOOGLE_ADS_DEFAULT_CAMPAIGN_STATUS: ${GOOGLE_ADS_DEFAULT_CAMPAIGN_STATUS:-PAUSED}
      GOOGLE_ADS_ENABLE_BROAD_MATCH: ${GOOGLE_ADS_ENABLE_BROAD_MATCH:-false}
      GOOGLE_ADS_DEFAULT_CPC_BID: ${GOOGLE_ADS_DEFAULT_CPC_BID:-}
      GOOGLE_ADS_DEFAULT_BIDDING_STRATEGY: ${GOOGLE_ADS_DEFAULT_BIDDING_STRATEGY:-ManualCpc}
      GOOGLE_ADS_API_TIMEOUT_SECONDS: ${GOOGLE_ADS_API_TIMEOUT_SECONDS:-60}
      GOOGLE_ADS_ENABLE_REAL_PUBLISHING: ${GOOGLE_ADS_ENABLE_REAL_PUBLISHING:-false}
      GOOGLE_ADS_USE_TEST_ACCOUNT: ${GOOGLE_ADS_USE_TEST_ACCOUNT:-false}
      GOOGLE_ADS_TEST_CUSTOMER_ID: ${GOOGLE_ADS_TEST_CUSTOMER_ID:-}
      GOOGLE_ADS_METRICS_SYNC_ENABLED: ${GOOGLE_ADS_METRICS_SYNC_ENABLED:-false}
      GOOGLE_ADS_METRICS_SYNC_INTERVAL_MINUTES: ${GOOGLE_ADS_METRICS_SYNC_INTERVAL_MINUTES:-1440}
      GOOGLE_ADS_METRICS_SYNC_DAYS: ${GOOGLE_ADS_METRICS_SYNC_DAYS:-7}
      GOOGLE_ADS_METRICS_DEFAULT_PERIOD_DAYS: ${GOOGLE_ADS_METRICS_DEFAULT_PERIOD_DAYS:-30}
      GOOGLE_ADS_ALLOW_TEST_ACCOUNT_ACTIVATION: ${GOOGLE_ADS_ALLOW_TEST_ACCOUNT_ACTIVATION:-false}
      GOOGLE_ADS_ENABLE_OPTIMIZATION_AI: ${GOOGLE_ADS_ENABLE_OPTIMIZATION_AI:-true}
      GOOGLE_ADS_OPTIMIZATION_MODEL: ${GOOGLE_ADS_OPTIMIZATION_MODEL:-}
      META_ADS_APP_ID: ${META_ADS_APP_ID:-}
      META_ADS_APP_SECRET: ${META_ADS_APP_SECRET:-}
      META_ADS_REDIRECT_URI: ${META_ADS_REDIRECT_URI:-http://localhost:5173/leadcaptura/configuracoes?metaAdsCallback=1}
      META_ADS_AUTH_ENDPOINT: ${META_ADS_AUTH_ENDPOINT:-https://www.facebook.com/v26.0/dialog/oauth}
      META_ADS_TOKEN_ENDPOINT: ${META_ADS_TOKEN_ENDPOINT:-https://graph.facebook.com/v26.0/oauth/access_token}
      META_ADS_USER_INFO_ENDPOINT: ${META_ADS_USER_INFO_ENDPOINT:-https://graph.facebook.com/v26.0/me}
      META_ADS_GRAPH_API_BASE_URL: ${META_ADS_GRAPH_API_BASE_URL:-https://graph.facebook.com}
      META_ADS_GRAPH_API_VERSION: ${META_ADS_GRAPH_API_VERSION:-v26.0}
      META_ADS_SCOPES: ${META_ADS_SCOPES:-public_profile business_management ads_read pages_show_list pages_read_engagement instagram_basic}
      META_ADS_DEFAULT_COUNTRY_CODE: ${META_ADS_DEFAULT_COUNTRY_CODE:-BR}
      Database__ApplyMigrationsOnStartup: "true"
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:8080
    ports:
      - "5080:8080"
    networks:
      - leadengine

  leadengine-web:
    build:
      context: .
      dockerfile: src/LeadEngine.Web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5080
        VITE_CORRETOR_WHATSAPP: ${VITE_CORRETOR_WHATSAPP}
    container_name: leadengine-web
    depends_on:
      - leadengine-api
    ports:
      - "5173:80"
    networks:
      - leadengine

volumes:
  leadengine-mysql-data:

networks:
  leadengine:
    driver: bridge
